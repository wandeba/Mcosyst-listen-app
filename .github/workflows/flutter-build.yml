name: Flutter Android Build & Release (Mcosyst)

on:
  push:
    tags:
      - 'v*.*.*'   # Run when you push a version tag like v1.0.0
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Rename build outputs
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/mcosyst-${VERSION}.apk
          mv build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/mcosyst-${VERSION}.aab

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mcosyst Flutter Builds
          path: |
            build/app/outputs/flutter-apk/mcosyst-*.apk
            build/app/outputs/bundle/release/mcosyst-*.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/mcosyst-*.apk
            build/app/outputs/bundle/release/mcosyst-*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
