
name: Build Flutter APK & AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Add timeout to prevent hanging

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Debug - Show runner info
        run: |
          echo "Runner OS: $(uname -a)"
          echo "Current directory: $(pwd)"
          echo "Available disk space:"
          df -h

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: flutter/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      # ... rest of your steps
