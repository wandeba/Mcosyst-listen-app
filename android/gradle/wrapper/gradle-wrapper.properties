# Enable AndroidX (required for modern Flutter projects)
android.useAndroidX=true
android.enableJetifier=true

# Optimize Gradle performance
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8

# Enable R8 (code shrinker and optimizer for release builds)
android.enableR8=true

# Flutter-specific settings
flutter.versionName=1.0.0
flutter.versionCode=1

# Prevent Flutter build cache from causing permission errors in CI (e.g. GitHub Actions)
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true

# Use stable Gradle metadata
kotlin.code.style=official
